
name: MLflow Model Training CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'artifacts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train-model:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow pandas numpy scikit-learn joblib

      - name: Run MLflow Project
        working-directory: MLProject
        run: |
          mlflow run . --env-manager=local

      - name: Copy model artifact
        run: |
          mkdir -p artifacts
          cp MLProject/artifacts/random_forest_model.joblib artifacts/random_forest_model.joblib

      - name: Commit model artifact
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add artifacts/random_forest_model.joblib

          git diff --cached --quiet || git commit -m "chore: update trained model"

          git push
